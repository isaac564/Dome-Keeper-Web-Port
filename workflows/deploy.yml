name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Change to "master" if your default branch is master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true # This explicitly forces GitHub to download the real game data

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # If your index.html is in a subfolder, change this to './subfolder-name'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
